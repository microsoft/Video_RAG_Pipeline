[project]
name = "summarize_video_content"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp",
    "azure-identity",
    "pydantic-settings",
    "python-dotenv",
    "openai",
    "core",
]

[tool.uv]
package = true

[tool.uv.sources]
core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["summarize_video_content"]

[dependency-groups]
test = [
    "pytest>=8.3.5",
    "pytest-timeout",
    "pytest-asyncio>=0.25.3",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
]
