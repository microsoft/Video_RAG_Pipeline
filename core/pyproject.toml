[project]
name = "core"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "setuptools",
    "httpx",
    "asyncio",
    "azure.servicebus",
    "pydantic",
    "dependency-injector"
]

[tool.setuptools]
packages = [ "core" ]

[tool.setuptools.package-dir]
core = "src"
"core.models" = "src/models"
"core.services" = "src/services"

# [tool.setuptools.packages.find]
# where = ["src"]
# exclude = ["tests"]
# namespaces = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]
